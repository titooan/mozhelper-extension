name: Create minor release tag

on:
  workflow_dispatch:

jobs:
  create-tag:
    # Manual workflow dispatch is available to repository collaborators. Keep the
    # release entry point limited to the repository owner on its default branch.
    if: >-
      github.actor == 'titooan' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag created with GITHUB_TOKEN does not trigger the tag-based
          # release workflow. This fine-grained PAT must have Contents: write.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Create the next minor-version tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing RELEASE_PAT repository secret."
            exit 1
          fi

          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest release tag is not a vMAJOR.MINOR.PATCH version: $latest_tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          next_tag="v${major}.$((minor + 1)).0"

          if git ls-remote --exit-code --tags origin "refs/tags/$next_tag" >/dev/null; then
            echo "Tag already exists: $next_tag"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"
          echo "Created $next_tag from $GITHUB_SHA"
